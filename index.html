<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600;700&display=swap');

/* ═══════════════════════════════════════════════════════
   DESIGN — «quaderno a quadretti di notte»
   Sfondo inchiostro con la griglia del quaderno, la domanda su un
   foglio di carta con il margine rosso, ogni materia ha il suo
   colore-evidenziatore (--acc, impostato dal registry).
   ═══════════════════════════════════════════════════════ */
:root {
  --bg:    #0b0e1a;
  --bg2:   #0f1326;
  --card:  #151a31;
  --card2: #1c2242;
  --ln:    rgba(255,255,255,.07);
  --ln2:   rgba(255,255,255,.13);
  --tx:    #f1f3ff;
  --mu:    #7b84ad;
  --mu2:   #a9b1d6;
  --ok:    #2fe39a;
  --ko:    #ff5a76;
  --gold:  #ffc94a;
  --acc:   #7c83ff;            /* cambia per materia */
  --paper: #fbf9f2;
  --ink:   #1c2140;
  --grid:  rgba(124,131,255,.07);
  --r:     20px;
  --sh:    0 18px 50px rgba(0,0,0,.45);
  --f-d:   'Bricolage Grotesque', 'Plus Jakarta Sans', system-ui, sans-serif;
  --f-b:   'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --f-m:   'JetBrains Mono', ui-monospace, monospace;
  --f-h:   'Caveat', 'Bradley Hand', cursive;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
button { font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }

body {
  font-family:var(--f-b);
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 420px at 50% -120px, color-mix(in srgb, var(--acc) 22%, transparent), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:auto, 24px 24px, 24px 24px;
  background-attachment:fixed;
  color:var(--tx);
  min-height:100vh; min-height:100svh; overflow-x:hidden;
  transition:background-color .4s;
}

.wrap {
  max-width:760px; margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 64px);
  position:relative; z-index:1;
}

/* ── MARCHIO ── */
.logo { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
.brand { display:flex; align-items:center; gap:10px; }
.mark {
  width:36px; height:36px; border-radius:11px; display:grid; place-items:center;
  background:linear-gradient(140deg, var(--acc), color-mix(in srgb, var(--acc) 45%, #ff7ab6));
  font-family:var(--f-d); font-weight:800; font-size:1.25rem; color:#fff;
  box-shadow:0 6px 20px color-mix(in srgb, var(--acc) 45%, transparent);
  transform:rotate(-6deg); transition:background .4s;
}
.wm { font-family:var(--f-d); font-weight:800; font-size:1.3rem; letter-spacing:-.5px; }
.wm em { font-style:normal; color:var(--acc); transition:color .4s; }
.sub { font-family:var(--f-h); font-size:1.15rem; color:var(--mu2); }
@media(max-width:400px){ .sub { font-size:1rem; white-space:nowrap; } .wm { font-size:1.15rem; } }
@media(max-width:340px){ .sub { display:none; } }

/* ── SCHERMATE ── */
.scr { display:none; }
.scr.on { display:block; animation:up .32s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

.lbl {
  font-family:var(--f-d); font-weight:700; font-size:.82rem; letter-spacing:.4px;
  text-transform:uppercase; color:var(--mu); margin:26px 2px 12px;
}

/* ════════ HOME ════════ */
.hero {
  position:relative; overflow:hidden;
  background:linear-gradient(160deg, var(--card2), var(--card));
  border:1px solid var(--ln2); border-radius:26px; padding:22px 20px 20px;
  box-shadow:var(--sh);
}
.hero::after {      /* scarabocchio a matita nell'angolo */
  content:''; position:absolute; right:-30px; top:-30px; width:150px; height:150px; border-radius:50%;
  border:2px dashed color-mix(in srgb, var(--acc) 40%, transparent); opacity:.6;
}
.hello { font-family:var(--f-d); font-weight:800; font-size:1.75rem; letter-spacing:-.6px; line-height:1.1; }
.hello .wave { display:inline-block; animation:wave 2.4s ease-in-out 1; transform-origin:70% 80%; }
@keyframes wave { 0%,60%,100%{transform:rotate(0)} 10%,30%{transform:rotate(16deg)} 20%,40%{transform:rotate(-8deg)} }
.hello-sub { font-family:var(--f-h); font-size:1.35rem; color:var(--mu2); margin-top:2px; }

.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
.kpi {
  background:rgba(255,255,255,.04); border:1px solid var(--ln); border-radius:16px;
  padding:11px 10px; text-align:left;
}
.kpi b { display:block; font-family:var(--f-d); font-weight:800; font-size:1.45rem; line-height:1; }
.kpi span { display:block; font-size:.7rem; color:var(--mu2); margin-top:5px; font-weight:600; line-height:1.25; }
.kpi.fire b { color:var(--gold); }

.resume {
  display:flex; align-items:center; gap:12px; width:100%; margin-top:12px;
  background:color-mix(in srgb, var(--rc, var(--acc)) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--rc, var(--acc)) 45%, transparent);
  border-radius:16px; padding:12px 14px; cursor:pointer; text-align:left;
  transition:transform .15s;
}
.resume:active { transform:scale(.98); }
.resume[hidden] { display:none; }
.resume .rs-play {
  width:38px; height:38px; flex-shrink:0; border-radius:50%; display:grid; place-items:center;
  background:var(--rc, var(--acc)); color:#fff; font-size:.95rem;
}
.resume .rs-t { font-size:.72rem; color:var(--mu2); font-weight:600; }
.resume .rs-n { font-weight:800; font-size:.92rem; line-height:1.25; }

/* Materie: griglia compatta a 2 colonne, anello di avanzamento */
.subj-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
@media(min-width:620px){ .subj-grid { grid-template-columns:repeat(3,1fr); } }
.subj-card {
  position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:10px;
  background:var(--card); border:1px solid var(--ln2); border-radius:var(--r);
  padding:14px; cursor:pointer; text-align:left; overflow:hidden;
  transition:transform .18s, border-color .18s, box-shadow .18s;
}
.subj-card::before {      /* tratto di evidenziatore */
  content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--acc); opacity:.85;
}
.subj-card:hover { transform:translateY(-2px); border-color:color-mix(in srgb, var(--acc) 60%, transparent); }
.subj-card:active { transform:scale(.97); }
.subj-card.empty { opacity:.45; }
.sc-ring {
  --p:0; width:50px; height:50px; border-radius:50%; display:grid; place-items:center;
  background:conic-gradient(var(--acc) calc(var(--p) * 1%), rgba(255,255,255,.08) 0);
}
.sc-ico {
  width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-size:1.25rem;
  background:var(--card);
}
.sc-name { font-family:var(--f-d); font-weight:800; font-size:1.02rem; letter-spacing:-.2px; }
.sc-n { font-size:.72rem; color:var(--mu2); font-weight:600; margin-top:-6px; }
.sc-pct {
  position:absolute; right:12px; top:14px; font-family:var(--f-m); font-size:.72rem; font-weight:700;
  color:var(--acc);
}

/* Schermata materia */
.back {
  display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--ln2);
  border-radius:50px; padding:8px 14px; font-weight:700; font-size:.85rem; cursor:pointer; margin-bottom:16px;
}
.subj-head { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.sh-ico {
  width:58px; height:58px; border-radius:18px; display:grid; place-items:center; font-size:1.8rem;
  background:color-mix(in srgb, var(--acc) 22%, var(--card)); border:1px solid color-mix(in srgb, var(--acc) 50%, transparent);
  transform:rotate(-4deg);
}
.sh-name { font-family:var(--f-d); font-weight:800; font-size:1.7rem; letter-spacing:-.6px; line-height:1.05; }
.sh-sub { font-family:var(--f-h); font-size:1.2rem; color:var(--mu2); }

.test-item {
  display:flex; align-items:center; gap:14px; padding:16px; margin-bottom:10px;
  background:var(--card); border:1px solid var(--ln2); border-radius:var(--r);
  cursor:pointer; transition:transform .16s, border-color .16s;
}
.test-item:hover { border-color:color-mix(in srgb, var(--acc) 60%, transparent); }
.test-item:active { transform:scale(.98); }
.test-item.coming { opacity:.45; cursor:default; }
.ti-ico {
  width:46px; height:46px; flex-shrink:0; border-radius:14px; display:grid; place-items:center; font-size:1.4rem;
  background:color-mix(in srgb, var(--acc) 16%, transparent);
}
.ti-body { flex:1; min-width:0; }
.ti-name { font-weight:800; font-size:.98rem; line-height:1.3; }
.ti-desc { font-size:.78rem; color:var(--mu2); margin-top:3px; line-height:1.4; }
.ti-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.ti-badge {
  font-family:var(--f-m); font-size:.66rem; font-weight:500; color:var(--mu2);
  background:rgba(255,255,255,.06); padding:3px 8px; border-radius:20px; white-space:nowrap;
}
.ti-bar { height:5px; border-radius:5px; background:rgba(255,255,255,.07); margin-top:10px; overflow:hidden; }
.ti-bar i { display:block; height:100%; border-radius:5px; background:linear-gradient(90deg, var(--acc), color-mix(in srgb, var(--acc) 50%, #fff)); }
.ti-right { display:flex; flex-direction:column; align-items:center; gap:2px; flex-shrink:0; }
.ti-best { font-family:var(--f-d); font-weight:800; font-size:1.1rem; color:var(--acc); }
.ti-bl { font-size:.62rem; color:var(--mu); font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.ti-go {
  width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
  background:var(--acc); color:#fff; font-size:.85rem;
}
.ti-soon { font-size:.7rem; color:var(--mu); font-style:italic; }

.empty-box {
  text-align:center; padding:30px 20px; color:var(--mu2);
  border:2px dashed var(--ln2); border-radius:var(--r);
  font-family:var(--f-h); font-size:1.3rem; line-height:1.3;
}

/* Storico */
.hist-box { background:var(--card); border:1px solid var(--ln); border-radius:var(--r); padding:16px 18px; margin-top:26px; }
.hist-hd  { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.hist-hd h3 { font-family:var(--f-d); font-weight:700; font-size:.82rem; letter-spacing:.4px; text-transform:uppercase; color:var(--mu); }
.btn-del {
  font-size:.72rem; font-weight:700; background:transparent; border:1px solid var(--ln2); color:var(--mu2);
  border-radius:20px; padding:4px 11px; cursor:pointer;
}
.hist-row { display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--ln); font-size:.82rem; }
.hist-row:last-child { border-bottom:none; }
.hr-date  { font-family:var(--f-m); font-size:.68rem; color:var(--mu); min-width:68px; }
.hr-pill  { font-size:.66rem; font-weight:800; padding:2px 8px; border-radius:20px; flex-shrink:0; text-transform:capitalize; }
.hr-topic { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--mu2); }
.hr-stars { font-size:.75rem; flex-shrink:0; }
.hr-pct   { font-family:var(--f-d); font-weight:800; min-width:40px; text-align:right; }
.phi { color:var(--ok); } .pmi { color:var(--gold); } .plo { color:var(--ko); }
.hist-empty { text-align:center; color:var(--mu2); padding:14px; font-family:var(--f-h); font-size:1.2rem; }

/* ════════ QUIZ ════════ */
.q-topbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.q-x {
  width:36px; height:36px; flex-shrink:0; border-radius:50%; display:grid; place-items:center;
  background:var(--card); border:1px solid var(--ln2); cursor:pointer; font-size:.95rem; color:var(--mu2);
}
.prog { flex:1; height:10px; background:rgba(255,255,255,.07); border-radius:100px; overflow:hidden; }
.prog-fill {
  height:100%; border-radius:100px; min-width:10px;
  background:linear-gradient(90deg, var(--acc), color-mix(in srgb, var(--acc) 45%, #fff));
  box-shadow:0 0 14px color-mix(in srgb, var(--acc) 60%, transparent);
  transition:width .45s cubic-bezier(.2,.8,.2,1);
}
.q-num { font-family:var(--f-m); font-size:.74rem; font-weight:700; color:var(--mu2); white-space:nowrap; }
.slive {
  font-family:var(--f-d); font-weight:800; font-size:.9rem; color:var(--gold); white-space:nowrap;
  background:rgba(255,201,74,.1); border-radius:20px; padding:4px 10px;
}
.slive.bump { animation:bump .4s ease; }
@keyframes bump { 40%{transform:scale(1.25)} }

.btn-txt {
  display:none; align-items:center; gap:5px; font-size:.76rem; font-weight:800;
  background:transparent; border:1.5px solid var(--acc); border-radius:20px; padding:5px 11px; cursor:pointer; white-space:nowrap;
}
.btn-txt.on { display:inline-flex; }

.q-stage { position:relative; display:flex; justify-content:center; align-items:center; min-height:8px; margin-bottom:10px; }
.tmr-c { position:relative; width:60px; height:60px; }
.tmr-c.off { display:none; }
.tmr-c svg { width:60px; height:60px; transform:rotate(-90deg); }
.tmr-c circle { fill:none; stroke-width:4; }
.tr-bg { stroke:rgba(255,255,255,.08); }
.tr-fg { stroke:var(--acc); stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s; }
.tmr {
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--f-m); font-size:1.15rem; font-weight:700;
}
.tmr-c.red .tr-fg { stroke:var(--ko); }
.tmr-c.red .tmr { color:var(--ko); animation:throb .45s infinite alternate; }
@keyframes throb { to{transform:scale(1.12)} }

.combo {
  position:absolute; right:0; top:50%; transform:translateY(-50%) scale(.6); opacity:0;
  font-family:var(--f-d); font-weight:800; font-size:.85rem; color:#fff;
  background:linear-gradient(135deg, #ff8a3d, #ff3d6e); padding:6px 12px; border-radius:30px;
  box-shadow:0 6px 18px rgba(255,80,90,.4); transition:transform .3s cubic-bezier(.3,1.6,.5,1), opacity .2s;
}
.combo.on { opacity:1; transform:translateY(-50%) scale(1); }

/* La domanda è scritta su un foglio di quaderno */
.q-card {
  position:relative; background:var(--paper); color:var(--ink);
  background-image:
    linear-gradient(rgba(60,90,200,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(60,90,200,.09) 1px, transparent 1px);
  background-size:20px 20px;
  border-radius:18px; padding:22px 22px 24px 40px; margin-bottom:14px;
  box-shadow:0 2px 0 rgba(255,255,255,.6) inset, var(--sh);
  transform:rotate(-.4deg);
}
.q-card::before {   /* margine rosso */
  content:''; position:absolute; left:26px; top:0; bottom:0; width:2px; background:rgba(230,70,90,.55);
}
.q-card::after {    /* scotch */
  content:''; position:absolute; top:-10px; left:50%; width:84px; height:20px; transform:translateX(-50%) rotate(2deg);
  background:color-mix(in srgb, var(--acc) 35%, rgba(255,255,255,.55)); border-radius:3px; opacity:.85;
}
.q-tag { font-family:var(--f-h); font-size:1.15rem; font-weight:700; color:color-mix(in srgb, var(--acc) 75%, var(--ink)); margin-bottom:4px; }
.q-text { font-family:var(--f-d); font-weight:700; font-size:1.2rem; line-height:1.45; letter-spacing:-.2px; }
.q-card.enter { animation:paper .45s cubic-bezier(.2,.9,.3,1.2); }
@keyframes paper { from{opacity:0; transform:translateY(16px) rotate(-3deg)} to{opacity:1; transform:rotate(-.4deg)} }

/* Frazioni impilate (matematica) */
.frac { display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; line-height:1.05; margin:0 .12em; font-size:.88em; }
.frac > span { padding:0 .18em; }
.frac > span:first-child { border-bottom:.08em solid currentColor; padding-bottom:.05em; }
.frac > span:last-child { padding-top:.05em; }

.opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media(max-width:560px){ .opts{grid-template-columns:1fr} }

.opt {
  --k:#7c83ff;
  position:relative; display:flex; align-items:center; gap:12px; padding:14px 16px; min-height:58px;
  background:var(--card); border:1.5px solid var(--ln2); border-radius:18px;
  cursor:pointer; font-size:.95rem; font-weight:700; text-align:left; line-height:1.35;
  transition:transform .14s, border-color .14s, background .14s, opacity .2s;
  animation:optin .35s cubic-bezier(.2,.8,.2,1) backwards;
}
.opt:nth-child(2){animation-delay:.05s} .opt:nth-child(3){animation-delay:.1s} .opt:nth-child(4){animation-delay:.15s}
@keyframes optin { from{opacity:0; transform:translateY(10px)} }
.opt:hover:not(:disabled) { border-color:var(--k); background:color-mix(in srgb, var(--k) 10%, var(--card)); }
.opt:active:not(:disabled) { transform:scale(.97); }
.opt:disabled { cursor:default; }
.ok-lbl {
  width:32px; height:32px; border-radius:10px; flex-shrink:0; display:grid; place-items:center;
  font-family:var(--f-d); font-size:.85rem; font-weight:800; background:var(--k); color:#0b0e1a;
}
.opt[data-s="0"] { --k:#ff6b8b; } .opt[data-s="1"] { --k:#5ab0ff; }
.opt[data-s="2"] { --k:#ffc94a; } .opt[data-s="3"] { --k:#4be3a0; }
.opts.done .opt:not(.correct):not(.wrong) { opacity:.45; }
.opt.correct { background:color-mix(in srgb, var(--ok) 16%, var(--card))!important; border-color:var(--ok)!important; animation:pop .4s cubic-bezier(.3,1.6,.5,1); }
.opt.correct .ok-lbl { background:var(--ok); }
.opt.wrong   { background:color-mix(in srgb, var(--ko) 14%, var(--card))!important; border-color:var(--ko)!important; animation:shake .4s; }
.opt.wrong .ok-lbl { background:var(--ko); color:#fff; }
@keyframes pop { 50%{transform:scale(1.04)} }
@keyframes shake { 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }

/* Risposta da scrivere (numeric / fraction) */
.num-box { grid-column:1/-1; display:flex; flex-direction:column; gap:10px; }
.num-row { display:flex; align-items:center; gap:10px; }
.num-in {
  flex:1; min-width:0; padding:15px 16px;
  background:var(--card); border:2px solid color-mix(in srgb, var(--acc) 70%, transparent); border-radius:18px;
  color:var(--tx); font-family:var(--f-m); font-size:1.15rem; font-weight:700; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.num-in:focus { box-shadow:0 0 0 4px color-mix(in srgb, var(--acc) 25%, transparent); }

.btn-next {

@keyframes floatup { 0%{opacity:0; transform:translate(-50%,10px) scale(.7)} 20%{opacity:1; transform:translate(-50%,0) scale(1.1)} 100%{opacity:0; transform:translate(-50%,-70px) scale(1)} }

/* ════════ READING ════════ */
.rd-sheet {
  background:var(--paper); color:var(--ink); border-radius:18px; padding:24px 22px; box-shadow:var(--sh); margin-bottom:16px;

<script>
// ═══════════════════════════════════════════════════════
//  COSTANTI
// ═══════════════════════════════════════════════════════
const PTS  = { fast:150, mid:100, slow:50 };
const KEYS = ['A','B','C','D'];

// Chiavi localStorage strutturate
// best score:   pietroquiz:<materia>:<id>:v<version>:best
// history:      pietroquiz:global:history
// Includere la versione nella chiave best rende il comportamento
// trasparente: cambi version → nuovo record, quello vecchio resta leggibile.
const lsKeyBest = (subj, id, ver) => `pietroquiz:${subj}:${id}:v${ver||1}:best`;
const lsKeyHist = () => `pietroquiz:global:history`;

// ═══════════════════════════════════════════════════════
//  STATO GLOBALE
// ═══════════════════════════════════════════════════════
let G = {
  subj:null,        // oggetto registry materia corrente
  testMeta:null,    // oggetto test da _registry
  testData:null,    // oggetto QUIZ_BANK[id]
  qs:[], idx:0, score:0, ans:[],
  _opts:[], _corrOrig:0, _curEv:null,
  tmr:null, tLeft:0
};

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  renderHome();
  flushOutbox();   // invia eventuali risultati rimasti in coda
});

// ═══════════════════════════════════════════════════════
//  HOME — MATERIE
// ═══════════════════════════════════════════════════════
const DEF_ACC = '#7c83ff';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

// Media dei record (best %) dei test attivi di una materia, per l'anello.
function subjProgress(s) {
  const act = (s.tests||[]).filter(t => t.enabled && window.QUIZ_BANK?.[t.id]);
  if (!act.length) return { act:0, pct:null };
  const bests = act.map(t => getBest(s.subject, t.id, window.QUIZ_BANK[t.id].version) || 0);
  const tried = act.filter((t,i) => bests[i] > 0).length;
  return { act:act.length, tried, pct: tried ? Math.round(bests.reduce((x,y)=>x+y,0) / act.length) : 0 };
}

function renderHome() {
  setColor(DEF_ACC);
  const cfg = window.QUIZ_CONFIG || {};
  document.getElementById('h-name').textContent = cfg.student || 'Pietro';
  const d = new Date();
  document.getElementById('today').textContent =
    d.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });

  // Statistiche dallo storico locale
  const ss = loadSess();
  const days = new Set(ss.map(r => new Date(r.date).toDateString()));
  let streak = 0; const c = new Date();
  if (!days.has(c.toDateString())) c.setDate(c.getDate() - 1);   // la serie resta viva fino a stasera
  while (days.has(c.toDateString())) { streak++; c.setDate(c.getDate() - 1); }
  document.getElementById('k-streak').textContent = streak;
  document.getElementById('k-done').textContent = ss.reduce((n, r) => n + (r.tot || 0), 0);
  const last = ss.slice(0, 10);
  document.getElementById('k-avg').textContent = last.length ? Math.round(last.reduce((n, r) => n + r.pct, 0) / last.length) + '%' : '—';
  document.getElementById('h-sub').textContent =
    !ss.length ? 'Pronto per il primo quiz?' :
    days.has(new Date().toDateString()) ? 'Oggi hai già studiato: continua così!' :
    streak ? `Non perdere la serie di ${streak} ${streak === 1 ? 'giorno' : 'giorni'}!` : 'Cosa ripassiamo oggi?';

  // «Riprendi»: l'ultimo test fatto, a un tocco
  const rs = document.getElementById('resume');
  const lt = ss.find(r => window.QUIZ_BANK?.[r.testId]);
  if (lt) {
    const sj = (window.QUIZ_REGISTRY||[]).find(x => x.subject === lt.subj);
    rs.style.setProperty('--rc', sj?.subjectColor || DEF_ACC);
    rs.innerHTML = `<span class="rs-play">▶</span><span><span class="rs-t">Riprendi · ultimo risultato ${lt.pct}%</span><br><span class="rs-n">${escHtml(lt.testTitle)}</span></span>`;
    rs.onclick = () => startQuiz(lt.testId);
    rs.hidden = false;
  } else rs.hidden = true;

  buildSubjects();
  renderHist();
}

function buildSubjects() {
  const reg = [...(window.QUIZ_REGISTRY || [])];
  const info = new Map(reg.map(s => [s.subject, subjProgress(s)]));
  reg.sort((a, b) => (info.get(b.subject).act > 0) - (info.get(a.subject).act > 0));   // prima le materie con test
  document.getElementById('subj-grid').innerHTML = reg.map(s => {
    const pr = info.get(s.subject);
    const label = pr.act ? `${pr.act} test` + (pr.tried ? ` · ${pr.tried} fatti` : '') : 'in arrivo';
    return `<button class="subj-card ${pr.act ? '' : 'empty'}" id="sc-${s.subject}" style="--acc:${s.subjectColor}"
              onclick="selSubj('${s.subject}')">
      <span class="sc-ring" style="--p:${pr.pct || 0}"><span class="sc-ico">${s.subjectIcon}</span></span>
      ${pr.tried ? `<span class="sc-pct">${pr.pct}%</span>` : ''}
      <span class="sc-name">${cap(s.subject)}</span>
      <span class="sc-n">${label}</span>
    </button>`;
  }).join('');
}

function openSubj() { if (G.subj) selSubj(G.subj.subject); else goHome(); }

function selSubj(subjId) {
  G.subj = (window.QUIZ_REGISTRY||[]).find(s => s.subject === subjId);
  if (!G.subj) return;
  setColor(G.subj.subjectColor);

  const tests = G.subj.tests || [];
  const list  = document.getElementById('test-list');
  const pr    = subjProgress(G.subj);
  document.getElementById('sh-ico').textContent  = G.subj.subjectIcon;
  document.getElementById('test-lbl').textContent = cap(subjId);
  document.getElementById('sh-sub').textContent  =
    !pr.act ? 'presto qui i nuovi quiz' : pr.tried ? `media dei record ${pr.pct}%` : 'scegli da dove partire';

  if (!tests.length) {
    list.innerHTML = `<div class="empty-box">Ancora niente qui…<br>papà sta preparando i quiz! ✏️</div>`;
  } else {
    list.innerHTML = tests.map(t => {
      const loaded  = !!window.QUIZ_BANK?.[t.id];
      const active  = t.enabled && loaded;
      const data    = loaded ? window.QUIZ_BANK[t.id] : null;
      const best    = active ? getBest(subjId, t.id, data.version) : null;
      const qCount  = loaded ? data.questions.length : t.questionCount;
      const onclick = active ? `onclick="startQuiz('${t.id}')"` : '';
      const isRd    = data?.type === 'reading';
      const tpqv    = data ? (data.timePerQuestion === 0 ? 0 : (data.timePerQuestion || 20)) : null;
      const nWrite  = data ? data.questions.filter(q => q.type === 'numeric' || q.type === 'fraction').length : 0;
      return `<div class="test-item ${active?'':'coming'}" ${onclick}>
        <span class="ti-ico">${t.icon||G.subj.subjectIcon}</span>
        <div class="ti-body">
          <div class="ti-name">${t.title}</div>
          <div class="ti-desc">${t.description||''}</div>
          <div class="ti-meta">
            <span class="ti-badge">${isRd?'📄 reading · ':''}${qCount ? qCount+' domande' : '—'}</span>
            ${data ? `<span class="ti-badge">${tpqv ? '⏱ ' + tpqv + ' s' : 'senza timer'}</span>` : ''}
            ${nWrite ? `<span class="ti-badge">✍️ ${nWrite} da scrivere</span>` : ''}
          </div>
          ${active ? `<div class="ti-bar"><i style="width:${best||0}%"></i></div>` : ''}
        </div>
        <div class="ti-right">
          ${!active ? `<span class="ti-soon">presto</span>` : best ? `<span class="ti-best">${best}%</span><span class="ti-bl">record</span>` : `<span class="ti-go">▶</span>`}
        </div>
      </div>`;
    }).join('');
  }
  showScr('s-subj');
}

// ═══════════════════════════════════════════════════════
//  QUIZ
// ═══════════════════════════════════════════════════════
function isReading() { return G.testData?.type === 'reading'; }
function tpq()       { const v = G.testData?.timePerQuestion; return (v === 0) ? 0 : (v || 20); }

function startQuiz(testId) {
  G.testData = window.QUIZ_BANK[testId];
  G.subj     = (window.QUIZ_REGISTRY||[]).find(s => s.subject === G.testData.subject);
  G.testMeta = G.subj?.tests?.find(t => t.id === testId);
  setColor(G.subj?.subjectColor || DEF_ACC);

  G.qs    = shuffle([...G.testData.questions]);
  G.idx   = 0; G.score = 0; G.ans = []; G.combo = 0;
  document.getElementById('combo').classList.remove('on');
  G.t0    = Date.now(); G.sent = false;

  if (isReading()) {
    // Prima il testo, come all'esame: si legge, poi si risponde.
    document.getElementById('rd-lbl').textContent = `📄 ${G.testData.title} — leggi il testo`;
    renderSheet('rd-sheet', null);
    showScr('s-read');
  } else {
    showScr('s-quiz');
    renderQ();
  }
}

function beginReadingQs() { showScr('s-quiz'); renderQ(); }

// Renderizza il testo del reading in un contenitore.
// Se ev è valorizzato, evidenzia la frase esatta (id hl-t per lo scroll).
function renderSheet(elId, ev) {
  const r = G.testData.reading || { paras: [] };
  let html = '';
  if (r.photo) html += `<div class="rd-photo">🖼️ ${r.photo}</div>`;
  html += r.paras.map(p => {
    let t = p;
    if (ev && p.includes(ev)) t = p.replace(ev, `<mark class="rd-hl" id="hl-t">${ev}</mark>`);
    return `<p>${t}</p>`;
  }).join('');
  document.getElementById(elId).innerHTML = html;
}

function renderQ() {
  const q = G.qs[G.idx], tot = G.qs.length;
  document.getElementById('q-num').textContent  = `${G.idx+1} / ${tot}`;
  document.getElementById('prog').style.width   = `${(G.idx/tot)*100}%`;
  document.getElementById('slive').textContent  = `⭐ ${G.score}`;
  document.getElementById('q-text').innerHTML   = mathify(q.q);
  document.getElementById('q-tag').textContent  = `${cap(G.testData.subject)} · domanda ${G.idx+1}`;
  const card = document.getElementById('q-card');
  card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
  document.getElementById('opts').classList.remove('done');

  G._curEv = q.ev || null;
  if (isNumQ(q)) {
    // Risposta da scrivere: niente opzioni, casella + unità + conferma
    G._opts = null; G._corrOrig = null;
    document.getElementById('opts').innerHTML =
      `<div class="num-box">
         <div class="num-row">
           <input class="num-in" id="num-in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                  placeholder="${isFracQ(q) ? 'scrivi la frazione' : 'scrivi il numero'}" onkeydown="if(event.key==='Enter')checkNum()"
                  ${isFracQ(q) ? 'oninput="fracPreview(this.value)"' : ''}>
           ${q.unit ? `<span class="num-unit">${q.unit}</span>` : ''}
           <button class="num-go" id="num-go" onclick="checkNum()">OK</button>
         </div>
         ${isFracQ(q) ? '<div class="num-prev" id="num-prev"></div>' : ''}
         <div class="num-hint">${isFracQ(q)
           ? 'Scrivi la frazione con la barra, per esempio 13/12 oppure -5/12. Un numero intero puoi scriverlo così com’è, per esempio -32.'
           : 'Usa la virgola per i decimali. Per le potenze di 10 scrivi per esempio 2,5x10^-4 oppure 2,5e-4.'}</div>
       </div>`;
    setTimeout(() => document.getElementById('num-in')?.focus(), 50);
  } else {
    const opts = shuffle(q.options.map((o,i) => ({text:o, orig:i})));
    G._opts = opts; G._corrOrig = q.answer;

    document.getElementById('opts').innerHTML = opts.map((o,i) =>
      `<button class="opt" data-s="${i}" onclick="pick(${i})">
         <span class="ok-lbl">${KEYS[i]}</span>
         <span>${mathify(o.text)}</span>
       </button>`
    ).join('');
  }

  hideFB();
  document.getElementById('btn-next').classList.remove('on');
  document.getElementById('btn-txt').classList.toggle('on', isReading());

  // Timer: timePerQuestion 0 → nessun timer (modalità reading)
  const t = tpq();
  if (t > 0) {
    document.getElementById('tmr-c').classList.remove('off');
    startTmr(t);
  } else {
    stopTmr();
    document.getElementById('tmr-c').classList.add('off');
  }
}

function pick(di) {
  stopTmr();
  const t = tpq();
  const elapsed = t > 0 ? (t - G.tLeft) : 0;
  const q  = G.qs[G.idx];
  const ok = G._opts[di].orig === G._corrOrig;
  let pts  = 0;
  if (ok) {
    // Senza timer (reading) il punteggio è fisso: niente premio velocità,
    // perché tornare sul testo è la strategia giusta, non un ritardo.
    pts = t > 0 ? (elapsed<=5?PTS.fast:elapsed<=12?PTS.mid:PTS.slow) : PTS.mid;
    G.score += pts;
  }

  G.ans.push({ q:q.q, ok, chosen:G._opts[di].text, correct:q.options[G._corrOrig], exp:q.explanation||'' });

  document.querySelectorAll('.opt').forEach((b,i) => {
    b.disabled=true;
    if (G._opts[i].orig===G._corrOrig) b.classList.add('correct');
    else if (i===di && !ok) b.classList.add('wrong');
  });
  showFB(ok, pts, q.explanation);
  document.getElementById('slive').textContent = `⭐ ${G.score}`;
  document.getElementById('btn-next').classList.add('on');
}

// ═══════════════════════════════════════════════════════
//  RISPOSTA DA SCRIVERE  (type:"numeric")
//  Campi: answer (numero), unit (facoltativo), answerText (come mostrare
//  la soluzione, facoltativo), tolerance (relativa, default 0.02 = 2%).
// ═══════════════════════════════════════════════════════
function isNumQ(q) { return q && (q.type === 'numeric' || q.type === 'fraction'); }
function isFracQ(q) { return q && q.type === 'fraction'; }

const SUP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':'+'};
function parseNum(raw) { return parseNumAll(raw)[0]; }
// Restituisce le letture possibili: il punto può essere decimale ("1.65")
// o separatore delle migliaia ("2.750"); con la virgola i punti sono migliaia.
function parseNumAll(raw) {
  let s = String(raw||'').trim().toLowerCase().replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g, c => SUP[c]);
  s = s.replace(/[−–]/g,'-').replace(/\s+/g,'');
  const variants = s.includes(',')
    ? [s.replace(/\.(?=\d{3}(\D|$))/g,'').replace(/,/g,'.')]
    : [s, s.replace(/\.(?=\d{3}(\D|$))/g,'')];
  const out = [];
  for (const t of variants) {
    const m = t.match(/^([+-]?(?:\d+\.?\d*|\.\d+))(?:(?:[x×*·]10\^?|e)([+-]?\d+))?/);
    if (m) out.push(parseFloat(m[1]) * (m[2] !== undefined ? Math.pow(10, parseInt(m[2],10)) : 1));
  }
  return out.length ? out : [NaN];
}
function numText(q) {
  if (isFracQ(q)) return q.answerText || String(q.answer);
  return q.answerText || (String(q.answer).replace('.', ',') + (q.unit ? ' ' + q.unit : ''));
}
function escHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function checkNum() {
  const q  = G.qs[G.idx];
  const el = document.getElementById('num-in');
  if (!el || el.disabled) return;
  const raw = el.value.trim();
  let ok, note = '';
  if (isFracQ(q)) {
    const r = checkFrac(q, raw);
    if (!r) { el.value = ''; el.focus(); el.placeholder = 'scrivi una frazione, es. 3/4'; return; }
    ok = r.ok; note = r.note;
  } else {
    const vals = parseNumAll(raw);
    if (!raw || isNaN(vals[0])) { el.focus(); el.placeholder = 'scrivi un numero'; return; }
    const tol = (q.tolerance !== undefined) ? q.tolerance : 0.02;
    ok = vals.some(v => q.answer === 0 ? Math.abs(v) < 1e-9 : Math.abs(v - q.answer) <= Math.abs(q.answer) * tol);
  }

  stopTmr();
  const t = tpq();
  const elapsed = t > 0 ? (t - G.tLeft) : 0;
  let pts = 0;
  if (ok) { pts = t > 0 ? (elapsed<=5?PTS.fast:elapsed<=12?PTS.mid:PTS.slow) : PTS.mid; G.score += pts; }

  G.ans.push({ q:q.q, ok, chosen:raw + (q.unit ? ' ' + q.unit : ''), correct:numText(q), exp:q.explanation||'' });

  el.disabled = true; el.classList.add(ok ? 'correct' : 'wrong');
  document.getElementById('num-go').disabled = true;
  showFB(ok, pts, note + (ok ? '' : 'Risultato: ' + numText(q) + '. ') + (q.explanation||''));
  document.getElementById('slive').textContent = `⭐ ${G.score}`;
  document.getElementById('btn-next').classList.add('on');
}

// ═══════════════════════════════════════════════════════
//  RISPOSTA A FRAZIONE  (type:"fraction")
//  Campi: answer (stringa "num/den" oppure intero, es. "-5/12", "-32"),
//  answerText (facoltativo), form: "reduced" (default: valore giusto E
//  ridotta ai minimi termini) | "exact" (stessi numeratore e denominatore,
//  es. «riduci al denominatore 30») | "any" (basta il valore).
// ═══════════════════════════════════════════════════════
function parseFrac(raw) {
  let s = String(raw||'').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g, c => SUP[c])
                         .replace(/[−–]/g,'-').replace(/[\s()]/g,'').replace(/:/g,'/');
  const m = s.match(/^([+-]*)(\d+)(?:\/([+-]*)(\d+))?$/);
  if (!m) return null;
  const neg = ((m[1].match(/-/g)||[]).length + ((m[3]||'').match(/-/g)||[]).length) % 2 === 1;
  const n = parseInt(m[2],10), d = m[4] !== undefined ? parseInt(m[4],10) : 1;
  if (d === 0) return null;
  return { n: neg ? -n : n, d };
}
// In matematica le frazioni a/b dei testi diventano frazioni impilate.
// Prima si fa l'escape (i testi sono testo semplice), poi si aggiunge il markup.
function mathify(s) {
  const h = escHtml(s);
  if (G.testData?.subject !== 'matematica') return h;
  return h.replace(/(^|[^\d,.\/\w])([−-]?)(\d+)\/(\d+)(?![\d\/,])/g,
    (m, pre, sg, a, b) => `${pre}${sg ? '−' : ''}<span class="frac"><span>${a}</span><span>${b}</span></span>`);
}
function fracPreview(v) {
  const el = document.getElementById('num-prev'); if (!el) return;
  const f = parseFrac(v);
  el.innerHTML = !f || !String(v).includes('/') ? '' :
    `<small>hai scritto</small> ${f.n < 0 ? '−' : ''}<span class="frac"><span>${Math.abs(f.n)}</span><span>${f.d}</span></span>`;
}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; }
function checkFrac(q, raw) {
  const u = parseFrac(raw), c = parseFrac(q.answer);
  if (!u) return null;
  const same = u.n * c.d === c.n * u.d;
  const form = q.form || 'reduced';
  if (!same) return { ok:false, note:'' };
  if (form === 'exact' && !(u.n === c.n && u.d === c.d))
    return { ok:false, note:'Il valore è giusto, ma qui serve proprio la forma richiesta. ' };
  if (form === 'reduced' && gcd(u.n, u.d) !== 1)
    return { ok:false, note:'Il valore è giusto, ma la frazione va ridotta ai minimi termini. ' };
  return { ok:true, note:'' };
}

function nextQ() { G.idx++; G.idx>=G.qs.length ? showRes() : renderQ(); }

// ═══════════════════════════════════════════════════════
//  OVERLAY TESTO (reading)
//  openText(false) → testo pulito (pulsante 📄 in alto)
//  openText(true)  → testo con la frase della domanda evidenziata
// ═══════════════════════════════════════════════════════
function openText(withEv) {
  if (!isReading()) return;
  renderSheet('ov-sheet', withEv ? G._curEv : null);
  document.getElementById('txt-ov').classList.add('on');
  const hl = document.getElementById('hl-t');
  if (hl) setTimeout(() => hl.scrollIntoView({behavior:'smooth', block:'center'}), 80);
  else document.getElementById('txt-ov').scrollTop = 0;
}
function closeText() { document.getElementById('txt-ov').classList.remove('on'); }

// ═══════════════════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════════════════
function startTmr(sec) {
  G.tLeft=sec; G.tTot=sec; updTmr(); clearInterval(G.tmr);
  G.tmr = setInterval(() => { G.tLeft--; updTmr(); if(G.tLeft<=0){clearInterval(G.tmr);timeUp();} }, 1000);
}
function stopTmr() { clearInterval(G.tmr); }
function updTmr()  {
  const el=document.getElementById('tmr'); el.textContent=G.tLeft;
  document.getElementById('tmr-c').classList.toggle('red', G.tLeft<=5);
  const ring=document.getElementById('tmr-ring'), C=2*Math.PI*26;
  ring.style.strokeDasharray=C; ring.style.strokeDashoffset=C*(1-G.tLeft/(G.tTot||G.tLeft||1));
}
function timeUp() {
  const q=G.qs[G.idx];
  if (isNumQ(q)) {
    G.ans.push({q:q.q,ok:false,chosen:'—',correct:numText(q),exp:q.explanation||''});
    const el=document.getElementById('num-in'); if(el) el.disabled=true;
    const go=document.getElementById('num-go'); if(go) go.disabled=true;
    showFB(false,0,'Risultato: '+numText(q)+'. '+(q.explanation||''),true);
    document.getElementById('btn-next').classList.add('on');
    return;
  }
  G.ans.push({q:q.q,ok:false,chosen:'—',correct:q.options[G._corrOrig],exp:q.explanation||''});
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(G._opts[i].orig===G._corrOrig)b.classList.add('correct');});
  showFB(false,0,q.explanation,true);
  document.getElementById('btn-next').classList.add('on');
}

// ═══════════════════════════════════════════════════════
//  FEEDBACK
// ═══════════════════════════════════════════════════════
function showFB(ok,pts,exp,timeout=false) {
  const el=document.getElementById('fb');
  el.className='fb on '+(ok?'ok':'ko');
  document.getElementById('fb-ico').textContent  = ok?'✅':timeout?'⏱️':'❌';
  document.getElementById('fb-main').textContent = ok?`Esatto! +${pts} punti`:timeout?'Tempo scaduto!':'Risposta errata';
  document.getElementById('fb-exp').innerHTML    = mathify(exp||'');
  document.getElementById('fb-go').classList.toggle('on', isReading() && !!G._curEv);
  document.getElementById('opts').classList.add('done');
  answerFx(ok, pts);
}

const PRAISE = ['Esatto!','Perfetto!','Grande!','Ottimo!','Così si fa!','Bravissimo!'];
function answerFx(ok, pts) {
  G.combo = ok ? (G.combo||0) + 1 : 0;
  const cb = document.getElementById('combo');
  cb.textContent = `🔥 ${G.combo} di fila`;
  cb.classList.toggle('on', G.combo >= 3);
  if (ok) {
    document.getElementById('fb-main').textContent =
      `${G.combo >= 3 ? '🔥 ' : ''}${PRAISE[Math.floor(Math.random()*PRAISE.length)]} +${pts} punti`;
    const fp = document.getElementById('float-pts');
    fp.textContent = `+${pts}`; fp.classList.remove('go'); void fp.offsetWidth; fp.classList.add('go');
    const sl = document.getElementById('slive');
    sl.classList.remove('bump'); void sl.offsetWidth; sl.classList.add('bump');
  }
  try { navigator.vibrate?.(ok ? 18 : [40, 50, 40]); } catch {}
  setTimeout(() => document.getElementById('btn-next').scrollIntoView({ behavior:'smooth', block:'nearest' }), 120);
}
function hideFB() {
  document.getElementById('fb').className='fb';
  document.getElementById('fb-go').classList.remove('on');
}

// ═══════════════════════════════════════════════════════
//  RISULTATI
// ═══════════════════════════════════════════════════════
function animateRing(pct) {
  const ring = document.getElementById('r-ring'), lab = document.getElementById('r-pct');
  const t0 = performance.now(), dur = 1100;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), v = Math.round(pct * (1 - Math.pow(1 - k, 3)));
    ring.style.setProperty('--p', v); lab.textContent = v + '%';
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const cols = [getComputedStyle(document.documentElement).getPropertyValue('--acc').trim(), '#ffc94a', '#4be3a0', '#5ab0ff', '#ff6b8b'];
  const P = Array.from({ length: 160 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, s: 5 + Math.random() * 6,
    r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function frame(now) {
    cx.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); cx.restore(); });
    if (now - t0 < 2600) requestAnimationFrame(frame); else { cx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })(t0);
}

function showRes() {
  stopTmr(); closeText();
  const tot=G.qs.length, ok=G.ans.filter(a=>a.ok).length, pct=Math.round(ok/tot*100);
  const [head,stars] = pct===100?['Perfetto, tutte giuste! 🏆','⭐⭐⭐']:pct>=90?['Fantastico! 🏆','⭐⭐⭐']:pct>=70?['Molto bene! 🎉','⭐⭐']:pct>=50?['Ci sei quasi 💪','⭐']:['Ripassa e riprova 📚',''];

  document.getElementById('r-head').textContent  = head;
  document.getElementById('r-pts').textContent   = G.score;
  document.getElementById('r-title').textContent = `${cap(G.subj?.subject)} · ${G.testData.title}`;
  document.getElementById('r-stars').textContent = stars;
  document.getElementById('r-ok').textContent    = ok;
  document.getElementById('r-ko').textContent    = tot-ok;
  document.getElementById('float-pts').classList.remove('go');
  document.getElementById('combo').classList.remove('on');
  animateRing(pct);
  if (pct >= 80) setTimeout(confetti, 350);

  document.getElementById('review').innerHTML = G.ans.map((a,i) => `
    <div class="rv ${a.ok?'ok':'ko'}">
      <div class="rv-q">${i+1}. ${mathify(a.q)}</div>
      <div class="rv-a">
        ${a.ok?`<span class="rv-ok">✅ ${mathify(a.chosen)}</span>`
               :`<span class="rv-ko">❌ ${mathify(a.chosen)}</span> <span class="rv-ok">→ ✅ ${mathify(a.correct)}</span>`}
      </div>
      ${a.exp?`<div class="rv-exp">${mathify(a.exp)}</div>`:''}
    </div>`).join('');

  // salva sessione + aggiorna best (chiave versionata)
  const subj=G.testData.subject, id=G.testData.id, ver=G.testData.version||1;
  saveSess({ subj, subjColor:G.subj?.subjectColor, testId:id, testTitle:G.testData.title, score:G.score, pct, ok, tot, stars, version:ver });
  const prev=getBest(subj,id,ver);
  if (!prev || pct>prev) localStorage.setItem(lsKeyBest(subj,id,ver), pct);

  reportAttempt(true);
  showScr('s-res');
}

// ═══════════════════════════════════════════════════════
//  REPORT A PAPÀ
//  1) invio automatico al foglio Google (se QUIZ_CONFIG.reportUrl è impostato)
//     con coda locale: se manca la rete, riprova all'apertura successiva;
//  2) pulsante "Manda a papà" che apre WhatsApp con il riepilogo.
// ═══════════════════════════════════════════════════════
const LS_OUTBOX = 'pietroquiz:outbox';
function txt(s) { return String(s??''); }   // i testi sono sempre testo semplice

function reportAttempt(completed) {
  if (G.sent || !G.testData || !G.ans.length) return;
  G.sent = true;
  const cfg = window.QUIZ_CONFIG || {};
  const ok  = G.ans.filter(a=>a.ok).length;
  const item = {
    id:        (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()),
    token:     cfg.token || '',
    student:   cfg.student || '',
    ts:        new Date().toISOString(),
    completed: !!completed,
    subject:   G.testData.subject,
    testId:    G.testData.id,
    testTitle: G.testData.title,
    version:   G.testData.version || 1,
    answered:  G.ans.length,
    total:     G.qs.length,
    ok,
    pct:       Math.round(ok / G.qs.length * 100),
    score:     G.score,
    seconds:   Math.round((Date.now() - (G.t0||Date.now())) / 1000),
    answers:   G.ans.map(a => ({ q:txt(a.q), chosen:txt(a.chosen), correct:txt(a.correct), ok:!!a.ok }))
  };
  G.lastReport = item;
  if (!cfg.reportUrl) return;
  let box = []; try { box = JSON.parse(localStorage.getItem(LS_OUTBOX)) || []; } catch {}
  box.push(item); if (box.length > 50) box = box.slice(-50);
  localStorage.setItem(LS_OUTBOX, JSON.stringify(box));
  flushOutbox();
}

async function flushOutbox() {
  const cfg = window.QUIZ_CONFIG || {};
  if (!cfg.reportUrl) return;
  let box = []; try { box = JSON.parse(localStorage.getItem(LS_OUTBOX)) || []; } catch {}
  for (const item of [...box]) {
    try {
      // text/plain + no-cors: richiesta "semplice", accettata da Google Apps Script
      await fetch(cfg.reportUrl, { method:'POST', mode:'no-cors',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(item) });
      let cur = []; try { cur = JSON.parse(localStorage.getItem(LS_OUTBOX)) || []; } catch {}
      localStorage.setItem(LS_OUTBOX, JSON.stringify(cur.filter(x => x.id !== item.id)));
    } catch { break; }   // niente rete: si riprova la prossima volta
  }
}

function sendToDad() {
  const r = G.lastReport; if (!r) return;
  const cfg  = window.QUIZ_CONFIG || {};
  const min  = Math.floor(r.seconds/60), sec = r.seconds%60;
  const wrong = r.answers.filter(a => !a.ok);
  let t = `📚 ${cfg.student||'Quiz'} — ${r.testTitle}\n✅ ${r.ok}/${r.total} (${r.pct}%) · ⏱ ${min} min ${sec} s\n`;
  if (wrong.length) {
    t += `\n❌ Da ripassare (${wrong.length}):\n`;
    wrong.slice(0, 12).forEach((a,i) => { t += `${i+1}. ${a.q}\n   → giusta: ${a.correct}${a.chosen && a.chosen!=='—' ? ` (ha risposto: ${a.chosen})` : ''}\n`; });
    if (wrong.length > 12) t += `… e altre ${wrong.length-12}\n`;
  } else t += `\n🏆 Tutte giuste!\n`;
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

// ═══════════════════════════════════════════════════════
//  NAVIGAZIONE
// ═══════════════════════════════════════════════════════
function showScr(id) { document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on')); document.getElementById(id).classList.add('on'); window.scrollTo(0,0); }
function goHome()  { reportAttempt(false); stopTmr(); closeText(); showScr('s-home'); renderHome(); }
function quitQuiz() {
  if (G.ans.length && G.idx < G.qs.length && !confirm('Vuoi uscire? Il quiz resta a metà.')) return;
  reportAttempt(false); stopTmr(); closeText(); openSubj();
}
function restart() { reportAttempt(false); startQuiz(G.testData.id); }
function setColor(c) {
  document.documentElement.style.setProperty('--acc',c);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0b0e1a');
}

// ═══════════════════════════════════════════════════════
//  DÉBRIEFING
// ═══════════════════════════════════════════════════════
function showDebrief() {
  const tot = G.ans.length;
  const ok  = G.ans.filter(a=>a.ok).length;
  const ko  = G.ans.filter(a=>!a.ok && a.chosen !== '—').length;
  const skip= G.ans.filter(a=>a.chosen === '—').length;

  document.getElementById('db-meta').textContent =
    `${G.testData.title} — ${G.subj?.subject||''}`;
  document.getElementById('db-counter').textContent =
    `✅ ${ok}  ❌ ${ko}${skip ? `  ⏱ ${skip}` : ''}  su ${tot}`;

  document.getElementById('db-cards').innerHTML = G.ans.map((a, i) => {
    const type   = a.ok ? 'ok' : a.chosen === '—' ? 'skip' : 'ko';
    const label  = a.ok ? '✅ Esatta' : a.chosen === '—' ? '⏱ Tempo' : '❌ Errata';

    // Riga risposta data (solo se sbagliata o scaduta)
    const chosenRow = (!a.ok && a.chosen !== '—') ? `
      <div class="db-chosen">
        <span class="dc-lbl">La tua risposta</span>
        <span class="dc-txt">${mathify(a.chosen)}</span>
      </div>` : '';

    // Riga risposta corretta (sempre)
    const correctRow = `
      <div class="db-correct">
        <span class="dc-lbl">${a.ok ? 'Risposta' : 'Corretta'}</span>
        <span class="dc-txt">${mathify(a.correct)}</span>
      </div>`;

    // Spiegazione (sempre se presente)
    const expRow = a.exp ? `
      <div class="db-exp">
        <div class="de-tag">Spiegazione</div>
        <div class="de-txt">${mathify(a.exp)}</div>
      </div>` : '';

    return `
      <div class="db-card ${type}">
        <div class="db-card-head">
          <div class="db-num">${i+1}</div>
          <div class="db-q">${mathify(a.q)}</div>
          <span class="db-status">${label}</span>
        </div>
        <div class="db-body">
          ${chosenRow}
          ${correctRow}
          ${expRow}
        </div>
      </div>`;
  }).join('');

  showScr('s-debrief');
}

// ═══════════════════════════════════════════════════════
//  STORICO  (chiavi strutturate)
// ═══════════════════════════════════════════════════════
function getBest(subj, id, ver) {
  // Legge il best score della versione corrente del test
  const v = localStorage.getItem(lsKeyBest(subj, id, ver||1));
  return v ? parseInt(v) : null;
}
function loadSess() {
  try { return JSON.parse(localStorage.getItem(lsKeyHist()))||[]; } catch { return []; }
}
function saveSess(d) {
  const s=loadSess(); s.unshift({...d, date:new Date().toISOString()});
  if(s.length>80) s.pop();
  localStorage.setItem(lsKeyHist(), JSON.stringify(s));
}
function renderHist() {
  const s=loadSess(), el=document.getElementById('hist-list');
  if(!s.length){el.innerHTML='<div class="hist-empty">Ancora nessun quiz: scegli una materia! 🚀</div>';return;}
  el.innerHTML=s.slice(0,15).map(r=>{
    const d=new Date(r.date);
    const ds=`${d.getDate()}/${d.getMonth()+1} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    const cls=r.pct>=80?'phi':r.pct>=60?'pmi':'plo';
    const capS=cap(r.subj);
    return `<div class="hist-row">
      <span class="hr-date">${ds}</span>
      <span class="hr-pill" style="background:${r.subjColor}22;color:${r.subjColor}">${capS}</span>
      <span class="hr-topic">${escHtml(r.testTitle)}</span>
      <span class="hr-stars">${r.stars||''}</span>
      <span class="hr-pct ${cls}">${r.pct}%</span>
    </div>`;
  }).join('');
}
function clearHist() {
  if(!confirm('Cancellare tutto lo storico e tutti i record?')) return;
  Object.keys(localStorage)
    .filter(k => k.startsWith('pietroquiz:') && k !== LS_OUTBOX)
    .forEach(k => localStorage.removeItem(k));
  renderHome();
}

// ═══════════════════════════════════════════════════════
//  UTILITY
// ═══════════════════════════════════════════════════════
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
